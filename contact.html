<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="contact_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <section class="contact-section">
    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <br><br>
        <input type="submit" value="Send Message">
    </form>
    </section>
    <div class="contact-us">
    <h2>Contact Us</h2>
    <p>Email: info@company.com</p>
    <p>Phone: +1 234 567 890</p>
    <p>Address: 123 Main Street, City, Country</p>
    <map name="company-map">
    <area shape="rect" coords="34,44,270,350" alt="Company Location" href="https://www.google.com/maps/place/123+Main+Street,+City,+Country" target="_blank">
    </map>
    <h3>Follow Us</h3>
    <p>
        <a href="https://www.facebook.com/company" target="_blank">Facebook</a> |
        <a href="https://www.twitter.com/company" target="_blank">Twitter</a> |
        <a href="https://www.linkedin.com/company" target="_blank">LinkedIn</a>
    </p>
</div>
</body>
</html>
