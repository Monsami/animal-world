<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,sans-serif;
}

:root{
    --logo-color:#84bd3f;
    --bg-light:linear-gradient(135deg,#edf7e7,#dcecff);
    --text-light:#1f2937;
    --form-light:#ffffff;
    --primary:#84bd3f;
    --primary-hover:#6fa52f;
    --secondary:#64748b;
    --secondary-hover:#475569;
    --input-bg:#f8fafc;
    --input-border:#cbd5e1;
    --header-bg:#1f3d1b;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--bg-light);
    color:var(--text-light);
    transition:0.4s;
    padding:20px;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    background:var(--header-bg);
    color:#fff;
    padding:18px 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
    z-index:1000;
}

header h1{
    font-size:26px;
    letter-spacing:1px;
    color:#fff;
}

.mode-switch{
    position:absolute;
    left:25px;
}

.switch{
    position:relative;
    display:inline-block;
    width:52px;
    height:26px;
}

.switch input{
    opacity:0;
    width:0;
    height:0;
}

.slider{
    position:absolute;
    cursor:pointer;
    inset:0;
    background:#cbd5e1;
    transition:.4s;
    border-radius:34px;
}

.slider::before{
    content:"";
    position:absolute;
    width:20px;
    height:20px;
    right:3px;
    bottom:3px;
    background:#fff;
    transition:.4s;
    border-radius:50%;
}

input:checked + .slider{
    background:var(--logo-color);
}

input:checked + .slider::before{
    transform:translateX(-26px);
}

form{
    width:100%;
    max-width:420px;
    background:var(--form-light);
    padding:38px 32px;
    border-radius:22px;
    box-shadow:0 12px 35px rgba(0,0,0,0.12);
    margin-top:90px;
    transition:0.4s;
}

form h2{
    text-align:center;
    margin-bottom:28px;
    color:var(--primary);
    font-size:30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#334155;
}

input[type="text"],
input[type="email"],
input[type="password"]{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid var(--input-border);
    border-radius:12px;
    outline:none;
    transition:0.3s;
    font-size:15px;
    background:var(--input-bg);
    color:#111827;
}

input:focus{
    border-color:var(--logo-color);
    box-shadow:0 0 10px rgba(132,189,63,0.25);
    background:#fff;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
    margin-top:10px;
}

button:hover{
    background:var(--primary-hover);
    transform:translateY(-2px);
}

.skip-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--secondary);
    color:#fff;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

.skip-btn:hover{
    background:var(--secondary-hover);
}

.links{
    text-align:center;
    margin-top:20px;
    font-size:14px;
    color:#475569;
}

.links a{
    color:var(--logo-color);
    text-decoration:none;
    font-weight:bold;
    transition:0.3s;
}

.links a:hover{
    color:#93a57e;
    text-decoration:underline;
}

.dark-mode{
    background:#1a1a1a;
    color:#f5f5f5;
}

.dark-mode form{
    background:#1a1a1a;
    box-shadow:0 12px 35px rgba(0,0,0,0.45);
}

.dark-mode form h2{
    color:var(--logo-color);
}

.dark-mode label{
    color:#e2e8f0;
}

.dark-mode input{
    background:#334155;
    border:1px solid #475569;
    color:#fff;
}

.dark-mode input:focus{
    border-color:var(--logo-color);
    box-shadow:0 0 10px rgba(132,189,63,0.3);
    background:#3b475c;
}

.dark-mode button{
    background:var(--logo-color);
    color:#111827;
}

.dark-mode button:hover{
    background:#6fa52f;
    color:#fff;
}

.dark-mode .skip-btn{
    background:#475569;
}

.dark-mode .skip-btn:hover{
    background:#334155;
}

.dark-mode .links{
    color:#cbd5e1;
}

.dark-mode .links a{
    color:#a3e635;
}

.dark-mode header{
    background:#1a1a1a;
}
</style>
</head>

<body>

<header>
    <h1>إنشاء حساب جديد لاستكشاف عالم الحيوان</h1>

    <div class="mode-switch">
        <label class="switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider"></span>
        </label>
    </div>
</header>

<form id="signupForm">
    <h2>إنشاء حساب جديد </h2>

    <label>الاسم الكامل</label>
    <input type="text" id="fullname" placeholder="اكتب اسمك الكامل" required>

    <label>البريد الإلكتروني</label>
    <input type="email" id="email" placeholder="اكتب البريد الإلكتروني" required>

    <label>اسم المستخدم</label>
    <input type="text" id="username" placeholder="اختر اسم مستخدم" required>

    <label>كلمة المرور</label>
    <input type="password" id="password" placeholder="اكتب كلمة المرور" required>

    <label>تأكيد كلمة المرور</label>
    <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" required>

    <button type="submit">إنشاء الحساب</button>
    <button type="button" class="skip-btn" onclick="skipPage()">تخطي</button>

    <div class="links">
        <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>
</form>

<script>
const form = document.getElementById("signupForm");

form.addEventListener("submit", function(e){
    e.preventDefault();

    const fullname = document.getElementById("fullname").value.trim();
    const email = document.getElementById("email").value.trim();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if(fullname && email && username && password && confirmPassword){
        if(password === confirmPassword){
            alert("تم إنشاء الحساب بنجاح!");
        }else{
            alert("كلمتا المرور غير متطابقتين");
        }
    }else{
        alert("من فضلك املأ جميع الحقول");
    }
});

function skipPage(){
window.location.href = "../index.html";
}

const toggle = document.getElementById("theme-toggle");

if(localStorage.getItem("theme") === "dark"){
    document.body.classList.add("dark-mode");
    toggle.checked = true;
}

toggle.addEventListener("change", function(){
    if(this.checked){
        document.body.classList.add("dark-mode");
        localStorage.setItem("theme", "dark");
    }else{
        document.body.classList.remove("dark-mode");
        localStorage.setItem("theme", "light");
    }
});
</script>

</body>
</html>
