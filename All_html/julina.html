<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الحياة البرية</title>
    <link rel="stylesheet" href="julina_style.css">

<style>

:root {
    --bg-body: #eef3f1;
    --card-bg: #ffffff;
    --text: #1b1b1b;
    --nav-bg: #ffffff;
    --logo: #2e7d32;
    --accent: #66bb6a;
    --overlay: rgba(0,0,0,0.5);
    --footer-bg: #e7ecea;
}

body.dark {
    --bg-body: #0f1720;
    --card-bg: #18222e;
    --text: #e8eef5;
    --nav-bg: #111a24;
    --logo: #7bd389;
    --accent: #4caf50;
    --overlay: rgba(0,0,0,0.65);
    --footer-bg: #111a24;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: var(--bg-body);
    color: var(--text);
    transition: 0.3s;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 5%;
    background-color: var(--nav-bg);
}

.logo {
    font-weight: 700;
    font-size: 28px;
    color: var(--logo);
}

nav ul {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    color: var(--text);
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px;
}

.animal-section {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 50px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.album-title {
    color: var(--logo);
    border-right: 6px solid var(--accent);
    padding-right: 15px;
    margin-bottom: 25px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.card {
    position: relative;
    height: 250px;
    border-radius: 15px;
    overflow: hidden;
}

.card img,
.card iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: none;
}

.overlay {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    opacity: 0;
}

.card:hover .overlay {
    opacity: 0.5;
}

.video-wide {
    grid-column: 1 / -1;
    height: 400px;
}

footer {
    background-color: var(--footer-bg);
    color: var(--text);
    padding: 20px 20px;
    text-align: center;
}

.sign {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px;
}

.sign input {
    padding: 12px 20px;
    border-radius: 50px;
}

.sign button {
    background-color: #edc9af;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
}
.sign button:hover {
    background-color: #d4a373;
}

.switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 24px;
}
.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .4s;
    border-radius: 50%;
}
input:checked + .slider {
    background-color: #525252;
}
input:checked + .slider:before {
    transform: translateX(26px);
}


</style>
</head>

<body>

    <header>
       <div class="nav-bar">
        <div class="logo">
          <span>عالم الحيوان</span>
        </div>
           <nav>
         <ul>
            <li><a href="index.html" class="active" target="_self">الرئيسية</a></li>
            <li><a href="./All_html/malk.html" target="contentFrame">الثدييات</a></li>
            <li><a href="./All_html/nada.html" target="contentFrame">الطيور</a></li>
            <li><a href="./All_html/mina.html" target="contentFrame">أعماق البحار</a></li>
            <li><a href="./All_html/nancy.html" target="contentFrame">المهددة بالانقراض</a></li>
            <li><a href="./All_html/julina.html" target="contentFrame">المعرض</a></li>
            <li><a href="./All_html/blog.html" target="contentFrame">المدونة</a></li>
            <li><a href="./All_html/contact.html" target="contentFrame">اتصل بنا</a></li>
            <li><a href="./All_html/login.html">تسجيل الدخول</a></li>
            <li><a href="./All_html/sign.html">إنشاء حساب  </a></li>
          </ul>
        </nav>

        <div class="mode-switch">
            <label class="switch">
                <input type="checkbox" id="theme-toggle" onclick="toggleDark()">
                <span class="slider round"></span>
    </label>
</div>
    </header>

<main class="container">

    <section class="animal-section">
        <h2 class="album-title">ثدييات</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/panda.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/zebra.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/lion.jpg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/ilS55P22lhE" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">طيور</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/929529b1b2d704ff49ee729e9f49b245.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/canary.jpeg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/toucan.jpeg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/V6C6nH2c0w8" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">حيوانات الماء</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/اخطبوط.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/dolfin.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/sea turtle.jpeg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/9UG7F6oplhU" allowfullscreen></iframe>
            </div>

        </div>
    </section>

</main>

<footer>
    <h3>اشترك لتصلك أحدث الأخبار</h3>

    <form class="sign" id="sign-form">
        <input type="email" placeholder="ادخل بريدك" required>
        <button type="submit">اشترك</button>
    </form>
    <hr>
    <p>© 2026 عالم الحيوان</p>
</footer>

<script>
function toggleDark(){
    document.body.classList.toggle("dark");
}
const toggleInput = document.getElementById('theme-toggle');
const htmlElement = document.documentElement;
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
    htmlElement.setAttribute('data-theme', 'dark');
    toggleInput.checked = true;
}
toggleInput.addEventListener('change', () => {
    if (toggleInput.checked) {
        htmlElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
    } else {
        htmlElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
    }
});
const signForm = document.getElementById('sign-form');
signForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const emailInput = signForm.querySelector('input[type="email"]');
    const email = emailInput.value.trim();
    if (email) {
        alert(`شكراً لاشتراكك! تم تسجيل بريدك الإلكتروني: ${email}`);
        emailInput.value = '';
    }
});
</script>

</body>
</html>
