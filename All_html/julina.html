<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الحياة البرية</title>
    <link rel="stylesheet" href="julina_style.css">
</head>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: #eef3f1;
    color: #1b1b1b;
}

header {
    text-align: center;
    padding: 60px 20px;
}

header h1 {
    font-size: 3.5rem;
    color: #2e7d32;
    text-transform: uppercase;
}

.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px;
}

.animal-section {
    background: #ffffff;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 50px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.album-title {
    color: #2e7d32;
    border-right: 6px solid #66bb6a;
    padding-right: 15px;
    margin-bottom: 25px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.card {
    position: relative;
    height: 250px;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
}

.card img,
.card iframe {
    width: 100%;
    height: 100%;
    border: none;
    object-fit: cover;
    transition: 0.5s;
}

.card:hover img {
    transform: scale(1.1);
}

.card iframe {
    pointer-events: auto;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.3s;
    color: #fff;
    font-size: 18px;
}

.card:hover .overlay {
    opacity: 1;
}
</style>

<body>

<header>
    <h1>معرض الحياة البرية</h1>
    <p>رحلة مذهلة عبر أجمل الحياة البرية والطبيعة</p>
</header>

<main class="container">

    <section class="animal-section">
        <h2 class="album-title">ثدييات</h2>
        <div class="gallery-grid">

            <div class="card">
                <img src="../image/panda.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/zebra.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/lion.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/ilS55P22lhE" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/V6C6nH2c0w8" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/4n2Ahw52rk0" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">طيور</h2>
        <div class="gallery-grid">

            <div class="card">
                <img src="../image/929529b1b2d704ff49ee729e9f49b245.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/canary.jpeg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/toucan.jpeg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_1" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_2" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_3" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">حيوانات الماء</h2>
        <div class="gallery-grid">

            <div class="card">
                <img src="../image/اخطبوط.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/dolfin.jpg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <img src="../image/sea turtle.jpeg">
                <div class="overlay"></div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/9UG7F6oplhU" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_4" allowfullscreen></iframe>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/VIDEO_ID_5" allowfullscreen></iframe>
            </div>

        </div>
    </section>

</main>

</body>
</html>
