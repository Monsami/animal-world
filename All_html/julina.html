<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الحياة البرية</title>
    <link rel="stylesheet" href="julina_style.css">

<style>

:root {
    --bg-body: #eef3f1;
    --card-bg: #ffffff;
    --text: #1b1b1b;
    --nav-bg: #ffffff;
    --logo: #2e7d32;
    --accent: #66bb6a;
    --overlay: rgba(0,0,0,0.5);
    --footer-bg: #e7ecea;
}

body.dark {
    --bg-body: #0f1720;
    --card-bg: #18222e;
    --text: #e8eef5;
    --nav-bg: #111a24;
    --logo: #7bd389;
    --accent: #4caf50;
    --overlay: rgba(0,0,0,0.65);
    --footer-bg: #111a24;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background-color: var(--bg-body);
    color: var(--text);
    transition: 0.3s;
}

.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 5%;
    background-color: var(--nav-bg);
}

.logo {
    font-weight: 700;
    font-size: 28px;
    color: var(--logo);
}

nav ul {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
}

nav ul li {
    margin: 0 15px;
}

nav ul li a {
    color: var(--text);
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px;
}

.animal-section {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 50px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

.album-title {
    color: var(--logo);
    border-right: 6px solid var(--accent);
    padding-right: 15px;
    margin-bottom: 25px;
}

.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.card {
    position: relative;
    height: 250px;
    border-radius: 15px;
    overflow: hidden;
}

.card img,
.card iframe {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: none;
}

.overlay {
    position: absolute;
    inset: 0;
    background: var(--overlay);
    opacity: 0;
}

.card:hover .overlay {
    opacity: 1;
}

.video-wide {
    grid-column: 1 / -1;
    height: 400px;
}

footer {
    background-color: var(--footer-bg);
    color: var(--text);
    padding: 60px 20px;
    text-align: center;
}

.sign {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px;
}

.sign input {
    padding: 12px 20px;
    border-radius: 50px;
}

.sign button {
    background-color: #edc9af;
    border: none;
    padding: 10px 20px;
    border-radius: 50px;
    cursor: pointer;
}

.classic-btn {
    padding: 6px 14px;
    border: 1px solid #333;
    background-color: #f5f5f5;
    color: #111;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
}

body.dark .classic-btn {
    background-color: #1f2a36;
    color: #fff;
    border: 1px solid #aaa;
}

</style>
</head>

<body>

<header>
    <div class="nav-bar">
        <div class="logo">عالم الحيوان</div>

        <nav>
            <ul>
                <li><a href="../index.html">الرئيسية</a></li>
                <li><a href="./malk.html">الثدييات</a></li>
                <li><a href="./nada.html">الطيور</a></li>
                <li><a href="./mina.html">أعماق البحار</a></li>
                <li><a href="./nancy.html">المهددة بالانقراض</a></li>
                <li><a href="./julina.html">المعرض</a></li>
                <li><a href="./blog.html">المدونة</a></li>
                <li><a href="./contact.html">اتصل بنا</a></li>
            </ul>
        </nav>

        <button class="classic-btn" onclick="toggleDark()">تبديل الوضع</button>
    </div>
</header>

<main class="container">

    <section class="animal-section">
        <h2 class="album-title">ثدييات</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/panda.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/zebra.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/lion.jpg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/ilS55P22lhE" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">طيور</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/929529b1b2d704ff49ee729e9f49b245.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/canary.jpeg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/toucan.jpeg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/V6C6nH2c0w8" allowfullscreen></iframe>
            </div>

        </div>
    </section>

    <section class="animal-section">
        <h2 class="album-title">حيوانات الماء</h2>
        <div class="gallery-grid">

            <div class="card"><img src="../image/اخطبوط.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/dolfin.jpg"><div class="overlay"></div></div>
            <div class="card"><img src="../image/sea turtle.jpeg"><div class="overlay"></div></div>

            <div class="card video-wide">
                <iframe src="https://www.youtube.com/embed/9UG7F6oplhU" allowfullscreen></iframe>
            </div>

        </div>
    </section>

</main>

<footer>
    <h3>اشترك لتصلك أحدث الأخبار</h3>

    <form class="sign">
        <input type="email" placeholder="ادخل بريدك">
        <button>اشترك</button>
    </form>

    <hr>

    <p>© 2026 عالم الحيوان</p>
</footer>

<script>
function toggleDark(){
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
